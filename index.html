<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הוספת לוז שבט פסגה 26-27 ליומן</title>
<style>
* { box-sizing: border-box; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
background: linear-gradient(135deg,#1e3c72,#2a5298);
min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
}
.card { background:#fff; border-radius:18px; padding:28px 22px; max-width:520px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.25); text-align:center; }
.logo { width:90px; margin-bottom:10px; }
h1 { font-size:24px; margin:0 0 6px; color:#1e3c72; }
.subtitle { color:#666; font-size:15px; margin:0 0 18px; }
.device { background:#eef4ff; border:1px solid #cfe0ff; color:#1e3c72; border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.6; text-align:right; margin-bottom:6px; }
.section { border-top:1px solid #eee; padding-top:18px; margin-top:18px; }
.section-title { font-size:19px; font-weight:700; color:#1e3c72; margin:0 0 12px; }
.btn { display:block; width:100%; border:0; border-radius:12px; padding:16px; font-size:17px; font-weight:700; cursor:pointer; margin:0 0 8px; font-family:inherit; text-align:center; text-decoration:none; }
.btn-main { background:#1a73e8; color:#fff; }
.btn-sm { background:#f1f3f4; color:#222; font-size:15px; padding:12px; font-weight:600; }
.links { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:2px; }
.lnk { background:none; border:0; color:#1a73e8; font-size:14px; text-decoration:underline; cursor:pointer; font-family:inherit; padding:4px; }
.alt { display:none; margin-top:12px; }
.alt.open { display:block; }
.msg { display:none; border-radius:12px; padding:14px; font-size:14px; line-height:1.7; text-align:right; margin-top:18px; }
.msg.show { display:block; }
.note { background:#fff8e1; border:1px solid #ffe082; color:#5d4037; }
.err { background:#fdecea; border:1px solid #f5c6cb; color:#8a1c1c; }
details { margin-top:22px; text-align:right; font-size:14px; color:#444; }
summary { cursor:pointer; color:#1a73e8; font-weight:600; }
details ol { padding-inline-start:20px; line-height:1.8; }
.foot { margin-top:18px; font-size:12px; color:#999; line-height:1.6; }
</style>
</head>
<body>
<div class="card">
<img class="logo" src="https://static.wixstatic.com/media/2713c6_54fc814e5dab40e99a2eaf372db73372~mv2.png" alt="לוגו שבט פסגה לאס וגאס">
<h1>לוז שבט פסגה 26-27</h1>
<p class="subtitle">בוחרים לוז ולוחצים על הכפתור הכוחל. זה הכל.</p>
<div class="device" id="deviceBox"></div>
<div class="section">
<p class="section-title">לוז חניכים ג׳-ח׳</p>
<button class="btn btn-main" data-add="pisga_he">הוספה ליומן שלי</button>
<div class="links">
<button class="lnk" data-add="pisga_en">English version</button>
<button class="lnk" data-toggle="pisga">אפשרויות נוספות</button>
</div>
<div class="alt" id="alt-pisga">
<button class="btn btn-sm" data-apple="pisga_he">פתיחה ביומן המכשיר (iPhone / iPad / Mac)</button>
<button class="btn btn-sm" data-google="pisga_he">הוספה דרך אתר Google Calendar</button>
<a class="btn btn-sm" data-file="pisga_he" href="#">הורדת קובץ יומן (ICS)</a>
</div>
</div>
<div class="section">
<p class="section-title">לוז ט׳</p>
<button class="btn btn-main" data-add="tet_he">הוספה ליומן שלי</button>
<div class="links">
<button class="lnk" data-add="tet_en">English version</button>
<button class="lnk" data-toggle="tet">אפשרויות נוספות</button>
</div>
<div class="alt" id="alt-tet">
<button class="btn btn-sm" data-apple="tet_he">פתיחה ביומן המכשיר (iPhone / iPad / Mac)</button>
<button class="btn btn-sm" data-google="tet_he">הוספה דרך אתר Google Calendar</button>
<a class="btn btn-sm" data-file="tet_he" href="#">הורדת קובץ יומן (ICS)</a>
</div>
</div>
<div class="section">
<p class="section-title">לוז שכב״ג</p>
<button class="btn btn-main" data-add="shchavag_he">הוספה ליומן שלי</button>
<div class="links">
<button class="lnk" data-add="shchavag_en">English version</button>
<button class="lnk" data-toggle="shchavag">אפשרויות נוספות</button>
</div>
<div class="alt" id="alt-shchavag">
<button class="btn btn-sm" data-apple="shchavag_he">פתיחה ביומן המכשיר (iPhone / iPad / Mac)</button>
<button class="btn btn-sm" data-google="shchavag_he">הוספה דרך אתר Google Calendar</button>
<a class="btn btn-sm" data-file="shchavag_he" href="#">הורדת קובץ יומן (ICS)</a>
</div>
</div>
<div class="msg note" id="noteBox"></div>
<div class="msg err" id="errorBox"></div>
<details>
<summary>מה קורה אחרי הלחיצה?</summary>
<div id="howto"></div>
</details>
<p class="foot">הלוז מתעדכן לבד. כל שינוי בלוז יופיע ביומן שלכם מעצמו - אין צורך להוסיף שוב.</p>
</div>
<script>
const ICS_BASE = "shaliach2lv-lab.github.io/calendar-shevet-pisga/";
const ICS_FILES = {
pisga_he: "unique-pisga.ics",
pisga_en: "unique-pisga-en.ics",
tet_he: "unique-tet.ics",
tet_en: "unique-tet-en.ics",
shchavag_he: "unique-shchavag.ics",
shchavag_en: "unique-shchavag-en.ics"
};
function webcalUrl(k) { return "webcal://" + ICS_BASE + ICS_FILES[k]; }
function httpsUrl(k) { return "https://" + ICS_BASE + ICS_FILES[k]; }
function googleUrl(k) { return "https://calendar.google.com/calendar/r" + "?" + "cid" + "=" + encodeURIComponent(webcalUrl(k)); }

const UA = navigator.userAgent || "";
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_MAC = /Macintosh/.test(UA) && !IS_IOS;
const IS_ANDROID = /Android/.test(UA);
const NATIVE = IS_IOS || IS_MAC;

const noteBox = document.getElementById("noteBox");
const errorBox = document.getElementById("errorBox");
function hideMsgs() { noteBox.classList.remove("show"); errorBox.classList.remove("show"); }
function showNote(h) { errorBox.classList.remove("show"); noteBox.innerHTML = h; noteBox.classList.add("show"); }
function openWebcal(k) {
hideMsgs();
const a = document.createElement("a");
a.href = webcalUrl(k); a.style.display = "none";
document.body.appendChild(a); a.click();
setTimeout(function() { a.remove(); }, 1500);
showNote('<b>עוד לחיצה אחת</b><br>נפתחת עכשו אפליקציית היומן של המכשיר. לחצו <b>הרשמה</b> (Subscribe) ואז <b>סיום</b> (Done).<br><br>לא נפתח כלום? <a href="' + googleUrl(k) + '" target="_blank" rel="noopener">לחצו כאן להוספה דרך Google</a>');
}
function openGoogle(k) {
hideMsgs();
window.open(googleUrl(k), "_blank");
showNote('<b>עוד לחיצה אחת</b><br>נפתח עכשו Google Calendar. אם מבקשים - התחברו לחשבון, ואז לחצו <b>הוספה</b> (Add).<br><br>תוך כמה דקות הלוז יופיע לבד גם באפליקציית היומן בטלפון.<br><br>לא נפתח כלום? <a href="' + googleUrl(k) + '" target="_blank" rel="noopener">לחצו כאן</a>');
}
function smartAdd(k) { if (NATIVE) { openWebcal(k); } else { openGoogle(k); } }

document.querySelectorAll("[data-add]").forEach(function(b) { b.addEventListener("click", function() { smartAdd(b.getAttribute("data-add")); }); });
document.querySelectorAll("[data-apple]").forEach(function(b) { b.addEventListener("click", function() { openWebcal(b.getAttribute("data-apple")); }); });
document.querySelectorAll("[data-google]").forEach(function(b) { b.addEventListener("click", function() { openGoogle(b.getAttribute("data-google")); }); });
document.querySelectorAll("[data-file]").forEach(function(a) { a.setAttribute("href", httpsUrl(a.getAttribute("data-file"))); });
document.querySelectorAll("[data-toggle]").forEach(function(b) { b.addEventListener("click", function() { document.getElementById("alt-" + b.getAttribute("data-toggle")).classList.toggle("open"); }); });

var dev, how;
if (IS_IOS) { dev = '<b>זיהינו אייפון / אייפד.</b><br>הכפתור הכוחל יפתח את אפליקציית היומן של המכשיר, ואתם רק מאשרים הרשמה. ללא צורך בחשבון Google.'; how = '<ol><li>נפתחת אפליקציית היומן עם חלונית הרשמה ליומן.</li><li>לוחצים <b>הרשמה</b> ואז <b>סיום</b>.</li><li>זה הכל - כל האירועים מופיעים ביומן ומתעדכנים לבד.</li></ol><p>אם לא נפתח כלום, פתחו את הדף ב-Safari ונסו שוב.</p>'; }
else if (IS_MAC) { dev = '<b>זיהינו מק (Mac).</b><br>הכפתור הכוחל יפתח את אפליקציית היומן, ואתם רק מאשרים הרשמה.'; how = '<ol><li>נפתחת אפליקציית היומן עם חלונית הרשמה ליומן.</li><li>לוחצים <b>הרשמה</b> ואז <b>סיום</b>.</li><li>זה הכל - כל האירועים מופיעים ביומן ומתעדכנים לבד.</li></ol><p>אם לא נפתח כלום, פתחו את הדף ב-Safari ונסו שוב.</p>'; }
else if (IS_ANDROID) { dev = '<b>זיהינו מכשיר אנדרואיד.</b><br>הכפתור הכוחל יפתח את Google Calendar, ואתם רק מאשרים הוספה. אחרי זה הלוז מופיע לבד באפליקציית היומן בטלפון.'; how = '<ol><li>נפתח Google Calendar - מתחברים לחשבון אם צריך.</li><li>לוחצים <b>הוספה</b> (Add).</li><li>תוך כמה דקות הלוז מופיע לבד באפליקציית היומן ומתעדכן לבד.</li></ol><p>אפליקציית יומן Google לא יודעת להוסיף יומן חדש בעצמה, ולכן ההוספה נעשית פעם אחת דרך האתר.</p>'; }
else { dev = '<b>אתם במחשב.</b><br>הכפתור הכוחל יפתח את Google Calendar בכרטיסייה חדשה, ואתם רק מאשרים הוספה. עדיף לפתוח את הדף הזה בטלפון.'; how = '<ol><li>נפתח Google Calendar - מתחברים לחשבון אם צריך.</li><li>לוחצים <b>הוספה</b> (Add).</li><li>תוך כמה דקות הלוז מופיע לבד באפליקציית היומן ומתעדכן לבד.</li></ol><p>אפליקציית יומן Google לא יודעת להוסיף יומן חדש בעצמה, ולכן ההוספה נעשית פעם אחת דרך האתר.</p>'; }
document.getElementById("deviceBox").innerHTML = dev;
document.getElementById("howto").innerHTML = how;
</script>
</body>
</html>
