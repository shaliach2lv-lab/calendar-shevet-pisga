<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Shevet Pisga</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 20px; color: #222; }
.wrap { max-width: 1100px; margin: 0 auto; }
h1 { color: #1e3c72; font-size: 22px; }
.warn { background: #fff3cd; border: 1px solid #ffe08a; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #7a5b00; margin-bottom: 16px; }
.panel { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.panel label { display: block; font-size: 13px; margin: 10px 0 4px; color: #555; }
.panel input[type="text"], .panel input[type="password"], .panel select { width: 100%; max-width: 420px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
.status { font-size: 13px; margin-top: 8px; }
.status.error { color: #c0392b; }
.status.ok { color: #1e824c; }
.calHeader { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 14px; }
.calHeader button { background: #1e3c72; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 16px; cursor: pointer; }
.calHeader span { font-size: 18px; font-weight: 600; min-width: 160px; text-align: center; }
.calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dayHeader { text-align: center; font-weight: 600; font-size: 12px; color: #666; padding: 4px 0; }
.dayCell { background: #fafbfc; border: 1px solid #e3e6ea; border-radius: 6px; min-height: 92px; padding: 4px; cursor: pointer; overflow: hidden; }
.dayCell:hover { background: #eef3fb; }
.dayCell.empty { background: transparent; border: none; cursor: default; }
.dayNum { font-size: 12px; color: #888; margin-bottom: 3px; }
.eventPill { background: #1e88e5; color: #fff; font-size: 11px; border-radius: 4px; padding: 2px 5px; margin-bottom: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eventPill:hover { background: #1666ad; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
.overlay.hidden { display: none; }
.modal { background: #fff; border-radius: 12px; padding: 22px 24px; width: 380px; max-width: 90vw; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
.modal h3 { margin-top: 0; color: #1e3c72; }
.modal label { display: block; font-size: 13px; margin: 10px 0 4px; color: #555; }
.modal input[type="text"], .modal input[type="date"], .modal input[type="time"] { width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
.modal .checkboxRow { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.modal .checkboxRow input { width: auto; }
.modalActions { display: flex; gap: 8px; margin-top: 18px; }
.modalActions button { flex: 1; padding: 9px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
#saveBtn { background: #1e824c; color: #fff; }
#deleteBtn { background: #c0392b; color: #fff; }
#cancelBtn { background: #ddd; color: #333; }
#modalError { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
<div class="wrap">
<h1>לוח בקרה - שבט פסגה</h1>
<div class="warn">עמוד זה פרטי לניהול הלוזים בלבד. הוא לא מיועד לציבור, ואינו קשור לכפתורי ההצטרפות ליומנים באתר הראשי. שינוי אירוע כאן מעדכן אוטומטית את קבצי הלוז בעברית ובאנגלית, וכך מגיע לכל מי שכבר מחובר ליומן.</div>
<div class="panel">
<label>GitHub Token (נדרש רק לשמירת שינויים; לצפייה בלבד אין צורך)</label>
<input type="password" id="tokenInput" placeholder="ghp_...">
<div class="status" id="tokenStatus"></div>
</div>
<div class="panel">
<label>בחר לוז</label>
<select id="scheduleSelect">
<option value="pisga">פסגה - כללי</option>
<option value="shchavag">שכב"ג</option>
<option value="tet">ט'</option>
</select>
<div class="status" id="loadStatus"></div>
</div>
<div class="panel">
<div class="calHeader">
<button id="prevMonth">›</button>
<span id="monthLabel"></span>
<button id="nextMonth">‹</button>
</div>
<div class="calGrid" id="calGrid"></div>
</div>
</div>
<div class="overlay hidden" id="modalOverlay">
<div class="modal">
<h3 id="modalTitle">אירוע</h3>
<label>תאריך</label>
<input type="date" id="fDate">
<div class="checkboxRow">
<input type="checkbox" id="fAllDay">
<label style="margin:0;" for="fAllDay">אירוע יום שלם</label>
</div>
<div id="timeFields">
<label>שעת התחלה</label>
<input type="time" id="fStart">
<label>שעת סיום</label>
<input type="time" id="fEnd">
</div>
<label>כותרת בעברית</label>
<input type="text" id="fTitleHe">
<label>כותרת באנגלית</label>
<input type="text" id="fTitleEn">
<div class="modalActions">
<button id="saveBtn">שמור</button>
<button id="deleteBtn">מחק</button>
<button id="cancelBtn">ביטול</button>
</div>
<div id="modalError"></div>
</div>
</div>
<script>
const REPO = 'shaliach2lv-lab/calendar-shevet-pisga';
const SCHEDULES = {
pisga: { label: 'פסגה - כללי', heFile: 'unique-pisga.ics', enFile: 'unique-pisga-en.ics' },
shchavag: { label: 'שכב"ג', heFile: 'unique-shchavag.ics', enFile: 'unique-shchavag-en.ics' },
tet: { label: "ט'", heFile: 'unique-tet.ics', enFile: 'unique-tet-en.ics' }
};
const state = {
scheduleKey: 'pisga',
events: [],
headerHe: [], footerHe: [], shaHe: null,
headerEn: [], footerEn: [], shaEn: null,
currentMonth: new Date(2026, 8, 1),
mode: 'add',
currentEvent: null
};
function getToken(){
const fromField = document.getElementById('tokenInput').value.trim();
if(fromField) { localStorage.setItem('gh_token_pisga', fromField); return fromField; }
return localStorage.getItem('gh_token_pisga') || '';
}
function setLoadStatus(msg, isError){
const el = document.getElementById('loadStatus');
el.textContent = msg;
el.className = 'status' + (isError ? ' error' : (msg ? ' ok' : ''));
}
function b64DecodeUnicode(str){
return decodeURIComponent(Array.prototype.map.call(atob(str.replace(/\n/g,'')), function(c){
return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
}).join(''));
}
function b64EncodeUnicode(str){
return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1){
return String.fromCharCode('0x' + p1);
}));
}
async function ghGetFile(path){
const token = getToken();
const headers = token ? { Authorization: 'token ' + token } : {};
const res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, { headers: headers });
if(!res.ok) throw new Error('שגיאה בקריאת ' + path + ' (קוד ' + res.status + ')');
const data = await res.json();
return { content: b64DecodeUnicode(data.content), sha: data.sha };
}
async function ghPutFile(path, content, sha, message){
const token = getToken();
if(!token) throw new Error('נדרש GitHub Token כדי לשמור שינויים');
const res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
method: 'PUT',
headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json' },
body: JSON.stringify({ message: message, content: b64EncodeUnicode(content), sha: sha })
});
if(!res.ok){
let msg = '';
try { const err = await res.json(); msg = err.message || ''; } catch(e){}
throw new Error('שגיאה בשמירת ' + path + ' (קוד ' + res.status + '): ' + msg);
}
return await res.json();
}
function parseICS(content){
const rawLines = content.split(/\r\n|\n/);
const lines = rawLines.filter(function(l, i){ return !(i === rawLines.length - 1 && l === ''); });
const firstIdx = lines.findIndex(function(l){ return l.indexOf('BEGIN:VEVENT') === 0; });
const lastIdx = lines.lastIndexOf('END:VEVENT');
const header = firstIdx === -1 ? lines.slice() : lines.slice(0, firstIdx);
const footer = firstIdx === -1 ? [] : lines.slice(lastIdx + 1);
const events = [];
let cur = null;
if(firstIdx !== -1){
lines.slice(firstIdx, lastIdx + 1).forEach(function(line){
if(line === 'BEGIN:VEVENT'){ cur = { uid: '', dtstamp: '', dtstartRaw: '', dtendRaw: '', summary: '' }; }
else if(line === 'END:VEVENT'){ events.push(cur); cur = null; }
else if(cur){
if(line.indexOf('UID:') === 0) cur.uid = line.slice(4);
else if(line.indexOf('DTSTAMP:') === 0) cur.dtstamp = line.slice(8);
else if(line.indexOf('DTSTART') === 0) cur.dtstartRaw = line;
else if(line.indexOf('DTEND') === 0) cur.dtendRaw = line;
else if(line.indexOf('SUMMARY:') === 0) cur.summary = line.slice(8);
}
});
}
return { header: header, footer: footer, events: events };
}
function serializeICS(header, footer, vevents){
let all = header.slice();
vevents.forEach(function(ev){
all = all.concat(['BEGIN:VEVENT','UID:' + ev.uid,'DTSTAMP:' + ev.dtstamp, ev.dtstartRaw, ev.dtendRaw, 'SUMMARY:' + ev.summary,'END:VEVENT']);
});
all = all.concat(footer);
return all.join('\r\n');
}
function parseDT(raw){
if(!raw) return { allDay: true, date: '', time: '' };
let m = raw.match(/VALUE=DATE:(\d{8})/);
if(m) return { allDay: true, date: m[1], time: '' };
m = raw.match(/:(\d{8})T(\d{6})/);
if(m) return { allDay: false, date: m[1], time: m[2] };
return { allDay: true, date: '', time: '' };
}
function addOneDay(ymd){
const y = +ymd.slice(0,4), mo = +ymd.slice(4,6) - 1, d = +ymd.slice(6,8);
const dt = new Date(y, mo, d + 1);
return '' + dt.getFullYear() + String(dt.getMonth()+1).padStart(2,'0') + String(dt.getDate()).padStart(2,'0');
}
function formatDT(prefix, dateYmd, timeHms, allDay){
if(allDay){
if(prefix === 'DTSTART') return 'DTSTART;VALUE=DATE:' + dateYmd;
return 'DTEND;VALUE=DATE:' + addOneDay(dateYmd);
}
return prefix + ';TZID=Asia/Jerusalem:' + dateYmd + 'T' + timeHms;
}
function nowStamp(){
const d = new Date();
return d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,'0') + String(d.getUTCDate()).padStart(2,'0') + 'T' + String(d.getUTCHours()).padStart(2,'0') + String(d.getUTCMinutes()).padStart(2,'0') + String(d.getUTCSeconds()).padStart(2,'0') + 'Z';
}
function ymdToInput(ymd){ return ymd.slice(0,4) + '-' + ymd.slice(4,6) + '-' + ymd.slice(6,8); }
function inputToYmd(v){ return v.replace(/-/g,''); }
function hmsToInput(hms){ return hms ? hms.slice(0,2) + ':' + hms.slice(2,4) : ''; }
function inputToHms(v){ return v.replace(':','') + '00'; }
async function loadSchedule(){
const sched = SCHEDULES[state.scheduleKey];
setLoadStatus('טוען...', false);
try{
const heFile = await ghGetFile(sched.heFile);
const enFile = await ghGetFile(sched.enFile);
const heParsed = parseICS(heFile.content);
const enParsed = parseICS(enFile.content);
state.headerHe = heParsed.header; state.footerHe = heParsed.footer; state.shaHe = heFile.sha;
state.headerEn = enParsed.header; state.footerEn = enParsed.footer; state.shaEn = enFile.sha;
const n = Math.min(heParsed.events.length, enParsed.events.length);
const events = [];
for(let i=0;i < n;i++){
const he = heParsed.events[i], en = enParsed.events[i];
const dt = parseDT(he.dtstartRaw);
const dtEnd = parseDT(he.dtendRaw);
events.push({
uidHe: he.uid, uidEn: en.uid, dtstampHe: he.dtstamp, dtstampEn: en.dtstamp,
date: dt.date, allDay: dt.allDay, start: dt.time, end: dtEnd.time,
summaryHe: he.summary, summaryEn: en.summary
});
}
state.events = events;
if(heParsed.events.length !== enParsed.events.length){
setLoadStatus('אזהרה: מספר האירועים בעברית (' + heParsed.events.length + ') שונה מבאנגלית (' + enParsed.events.length + '). מוצגים ' + n + ' בלבד.', true);
} else {
setLoadStatus('נטען בהצלחה (' + n + ' אירועים).', false);
}
if(events.length){
const first = events[0].date;
state.currentMonth = new Date(+first.slice(0,4), +first.slice(4,6)-1, 1);
}
renderCalendar();
}catch(err){
setLoadStatus(err.message, true);
}
}
function renderCalendar(){
const grid = document.getElementById('calGrid');
grid.innerHTML = '';
const year = state.currentMonth.getFullYear();
const month = state.currentMonth.getMonth();
document.getElementById('monthLabel').textContent = state.currentMonth.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
['א','ב','ג','ד','ה','ו','ש'].forEach(function(d){
const el = document.createElement('div'); el.className = 'dayHeader'; el.textContent = d; grid.appendChild(el);
});
const firstDay = new Date(year, month, 1);
const startOffset = firstDay.getDay();
const daysInMonth = new Date(year, month+1, 0).getDate();
for(let i=0;i < startOffset;i++){
const el = document.createElement('div'); el.className = 'dayCell empty'; grid.appendChild(el);
}
for(let day=1; day <= daysInMonth; day++){
const dateYmd = '' + year + String(month+1).padStart(2,'0') + String(day).padStart(2,'0');
const cell = document.createElement('div');
cell.className = 'dayCell';
const num = document.createElement('div'); num.className = 'dayNum'; num.textContent = day;
cell.appendChild(num);
state.events.filter(function(e){ return e.date === dateYmd; }).forEach(function(ev){
const pill = document.createElement('div');
pill.className = 'eventPill';
pill.textContent = ev.summaryHe || ev.summaryEn || '(ללא כותרת)';
pill.addEventListener('click', function(e){ e.stopPropagation(); openEditModal(ev); });
cell.appendChild(pill);
});
cell.addEventListener('click', function(){ openAddModal(dateYmd); });
grid.appendChild(cell);
}
}
function openAddModal(dateYmd){
state.mode = 'add';
state.currentEvent = null;
document.getElementById('modalTitle').textContent = 'אירוע חדש';
document.getElementById('fDate').value = ymdToInput(dateYmd);
document.getElementById('fAllDay').checked = false;
document.getElementById('fStart').value = '';
document.getElementById('fEnd').value = '';
document.getElementById('fTitleHe').value = '';
document.getElementById('fTitleEn').value = '';
document.getElementById('deleteBtn').style.display = 'none';
document.getElementById('modalError').textContent = '';
toggleTimeFields();
document.getElementById('modalOverlay').classList.remove('hidden');
}
function openEditModal(ev){
state.mode = 'edit';
state.currentEvent = ev;
document.getElementById('modalTitle').textContent = 'עריכת אירוע';
document.getElementById('fDate').value = ymdToInput(ev.date);
document.getElementById('fAllDay').checked = ev.allDay;
document.getElementById('fStart').value = hmsToInput(ev.start);
document.getElementById('fEnd').value = hmsToInput(ev.end);
document.getElementById('fTitleHe').value = ev.summaryHe;
document.getElementById('fTitleEn').value = ev.summaryEn;
document.getElementById('deleteBtn').style.display = 'block';
document.getElementById('modalError').textContent = '';
toggleTimeFields();
document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modalOverlay').classList.add('hidden'); }
function toggleTimeFields(){
document.getElementById('timeFields').style.display = document.getElementById('fAllDay').checked ? 'none' : 'block';
}
function toHeVevent(ev){
return { uid: ev.uidHe, dtstamp: ev.dtstampHe, dtstartRaw: formatDT('DTSTART', ev.date, ev.start, ev.allDay), dtendRaw: formatDT('DTEND', ev.date, ev.end, ev.allDay), summary: ev.summaryHe };
}
function toEnVevent(ev){
return { uid: ev.uidEn, dtstamp: ev.dtstampEn, dtstartRaw: formatDT('DTSTART', ev.date, ev.start, ev.allDay), dtendRaw: formatDT('DTEND', ev.date, ev.end, ev.allDay), summary: ev.summaryEn };
}
async function saveToGithub(successMsg){
const sched = SCHEDULES[state.scheduleKey];
state.events.sort(function(a,b){ return (a.date + a.start).localeCompare(b.date + b.start); });
const heContent = serializeICS(state.headerHe, state.footerHe, state.events.map(toHeVevent));
const enContent = serializeICS(state.headerEn, state.footerEn, state.events.map(toEnVevent));
const putHe = await ghPutFile(sched.heFile, heContent, state.shaHe, 'עדכון לוז דרך לוח הבקרה');
state.shaHe = putHe.content.sha;
const putEn = await ghPutFile(sched.enFile, enContent, state.shaEn, 'עדכון לוז דרך לוח הבקרה');
state.shaEn = putEn.content.sha;
setLoadStatus(successMsg, false);
}
async function onSave(){
const errEl = document.getElementById('modalError');
errEl.textContent = '';
try{
const dateYmd = inputToYmd(document.getElementById('fDate').value);
const allDay = document.getElementById('fAllDay').checked;
const startVal = document.getElementById('fStart').value;
const endVal = document.getElementById('fEnd').value;
const titleHe = document.getElementById('fTitleHe').value.trim();
const titleEn = document.getElementById('fTitleEn').value.trim();
if(!dateYmd || dateYmd.length !== 8) throw new Error('יש לבחור תאריך');
if(!titleHe && !titleEn) throw new Error('יש למלא כותרת בעברית או באנגלית');
if(!allDay && (!startVal || !endVal)) throw new Error('יש למלא שעת התחלה ושעת סיום, או לסמן "אירוע יום שלם"');
const start = allDay ? '' : inputToHms(startVal);
const end = allDay ? '' : inputToHms(endVal);
if(state.mode === 'add'){
const ts = Date.now();
state.events.push({
uidHe: 'new-' + ts + '@shaliach2lv-lab.github.io', uidEn: 'new-en-' + ts + '@shaliach2lv-lab.github.io',
dtstampHe: nowStamp(), dtstampEn: nowStamp(), date: dateYmd, allDay: allDay, start: start, end: end,
summaryHe: titleHe, summaryEn: titleEn
});
} else {
const ev = state.currentEvent;
ev.date = dateYmd; ev.allDay = allDay; ev.start = start; ev.end = end;
ev.summaryHe = titleHe; ev.summaryEn = titleEn;
}
document.getElementById('saveBtn').disabled = true;
await saveToGithub('האירוע נשמר ועודכן בכל קבצי הלוז.');
document.getElementById('saveBtn').disabled = false;
closeModal();
renderCalendar();
}catch(err){
document.getElementById('saveBtn').disabled = false;
errEl.textContent = err.message;
}
}
async function onDelete(){
const errEl = document.getElementById('modalError');
try{
if(!state.currentEvent) return;
if(!confirm('למחוק את האירוע?')) return;
const idx = state.events.indexOf(state.currentEvent);
if(idx < 0){} else { state.events.splice(idx, 1); }
await saveToGithub('האירוע נמחק מכל קבצי הלוז.');
closeModal();
renderCalendar();
}catch(err){
errEl.textContent = err.message;
}
}
document.getElementById('saveBtn').addEventListener('click', onSave);
document.getElementById('deleteBtn').addEventListener('click', onDelete);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('fAllDay').addEventListener('change', toggleTimeFields);
document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id === 'modalOverlay') closeModal(); });
document.getElementById('prevMonth').addEventListener('click', function(){
state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth()-1, 1);
renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', function(){
state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth()+1, 1);
renderCalendar();
});
document.getElementById('scheduleSelect').addEventListener('change', function(){
state.scheduleKey = this.value;
loadSchedule();
});
document.getElementById('tokenInput').addEventListener('change', function(){
const t = this.value.trim();
if(t) localStorage.setItem('gh_token_pisga', t);
});
(function init(){
const saved = localStorage.getItem('gh_token_pisga');
if(saved) document.getElementById('tokenInput').value = saved;
loadSchedule();
})();
</script>
</body>
</html>
